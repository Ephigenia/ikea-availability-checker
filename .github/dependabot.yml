version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    # release-please only creates releases for feat/fix commits, so runtime
    # dependency updates use "fix" while dev dependencies stay on "build"
    commit-message:
      prefix: "fix"
      prefix-development: "build"
      include: "scope"
    groups:
      # bundle security updates (incl. transitive dependencies) into one PR
      security:
        applies-to: security-updates
        patterns:
          - "*"
      dev-ci:
        dependency-type: "development"
        patterns:
          - "@commitlint/*"
          - "husky"
      dev-types:
        dependency-type: "development"
        patterns:
          - "@types/*"
      dev-testing:
        dependency-type: "development"
        patterns:
          - "jest"
          - "ts-jest"
          - "nock"
          - "eslint-plugin-jest"
      dev-lint:
        dependency-type: "development"
        patterns:
          - "eslint"
          - "eslint-plugin-*"
          - "@typescript-eslint/*"
          - "prettier"
      dev-typescript:
        dependency-type: "development"
        patterns:
          - "typescript"
          - "ts-node"
      dev-other:
        dependency-type: "development"
        patterns:
          - "pinst"
          - "rimraf"

  - package-ecosystem: "github-actions"
    # include the local composite actions, not only .github/workflows
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
