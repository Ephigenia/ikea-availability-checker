name: Check PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    # read the PR title and comment on the PR when it is invalid
    permissions:
      pull-requests: write
    steps:
      - id: lint
        # SEE https://github.com/amannn/action-semantic-pull-request
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ failure() }}
        # do not use user injected variable values directly here as they are
        # open to injection attacks
        # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
        env:
          TITLE: ${{ github.event.pull_request.title }}
          ERROR: ${{ steps.lint.outputs.error_message }}
          WORKFLOW: ${{ github.workflow }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # javascript
          script: |
            const title = process.env.TITLE ?? "";
            const error = process.env.ERROR ?? "";
            const workflow = process.env.WORKFLOW ?? "Check PR title";
            const output = `The pull-request title "${title}" does not apply to [Conventional Commit Guidelines](https://www.conventionalcommits.org).
            \`\`\`
            ${error}
            \`\`\`
            <sub>🤖 This comment was automatically created by the "${workflow}" workflow.</sub>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
