name: default

on:
  push:
    branches:
    - main
    - alpha
    - beta
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # super-linter reports a commit status per linter
    permissions:
      contents: read
      statuses: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full git history is needed to get a proper list of changed files within `super-linter`
        fetch-depth: 0
    - uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_ALL_CODEBASE: false
        VALIDATE_JAVASCRIPT_ES: true
        VALIDATE_EDITORCONFIG: true
        VALIDATE_BASH: true
        VALIDATE_BASH_EXEC: true
        FILTER_REGEX_EXCLUDE: CHANGELOG.md,postman/**/*.yaml,postman/**/*.json

  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup
    - run: npm run build

  test:
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
    - run: npm test
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: code-coverage-report
        path: coverage
        retention-days: 30

  coverage-comment:
    needs: test
    if: >-
      ${{ github.actor != 'dependabot[bot]'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: code-coverage-report
        path: coverage
    - uses: vebr/jest-lcov-reporter@eacce47f9cc1b8dff73ddaca35a3b9e797b9207f # v0.2.1
      continue-on-error: true
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        lcov-file: ./coverage/lcov.info
        update-comment: true

  release:
    # ignore pull-requests created by dependabot as it doesn’t has access
    # to the secrets used
    if: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # release-please creates/updates the release PR, its labels, tags and
    # GitHub releases
    permissions:
      contents: write
      issues: write
      pull-requests: write
    needs:
      - test
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          release-type: node

  publish:
    if: ${{ needs.release.outputs.release_created }}
    permissions:
      contents: read
      id-token: write # id-token is required for npm provenance
    runs-on: ubuntu-latest
    needs:
      - release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm stage publish
