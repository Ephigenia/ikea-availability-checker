name: gitleaks

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action comments on PRs when it finds leaks
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: gitleaks-action
      uses: zricethezav/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
