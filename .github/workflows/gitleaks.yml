name: gitleaks

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action comments on PRs when it finds leaks
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - name: gitleaks-action
      uses: zricethezav/gitleaks-action@v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
